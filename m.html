<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三元</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --accent: #f39c12;
            --primary: #3498db;
            --secondary: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --movie: #3498db;
            --book: #e74c3c;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.08);
            --page-bg: linear-gradient(135deg, #1a2a6c, #2c3e50);
            --accent-color: #4fc3f7;
            --tab-bg: rgba(0, 0, 0, 0.4);
            --tab-active: rgba(52, 152, 219, 0.6);
        }
        
        body {
            background: var(--page-bg);
            color: var(--light);
            line-height: 1.6;
            padding-bottom: 50px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        /* 标签页导航 */
        .tabs-nav {
            display: flex;
            justify-content: center;
            background: var(--tab-bg);
            border-radius: 50px;
            padding: 8px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .tab-btn {
            flex: 1;
            padding: 15px 25px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .tab-btn.active {
            background: var(--tab-active);
            color: white;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .action-bar {
            display: flex;
            padding: 15px 0;
            margin: 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            /*make this sticky*/
            position: sticky;
            z-index: 100;
            top: 0;
        }
        
        .action-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
        }
        
        .action-btn:hover {
            background: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(243, 156, 18, 0.4);
        }
        
        .filter-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .search-results-section {
            display: none;
        }

        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }
        
        .items-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        
        .item-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .item-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            background: var(--card-hover);
        }
        
        .item-image {
            height: 350px;
            overflow: hidden;
            position: relative;
        }
        
        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .item-card:hover .item-image img {
            transform: scale(1.05);
        }
        
        .item-id {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--dark);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .item-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .item-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .item-description {
            margin-bottom: 15px;
            flex: 1;
             overflow: hidden;
            position: relative;
            line-height: 1.5;
            max-height: 4.5em;
            /* 3行文字高度 */
            transition: max-height 0.3s ease;
        }
        
        .item-description.expanded {
            max-height: none;
        }

        .item-description::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1.5em;
            /*
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(161, 187, 211, 1));
            */
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .item-description.expanded::after {
            opacity: 0;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 5px 0;
            text-align: left;
            margin-top: 5px;
        }

        .toggle-btn:hover {
            text-decoration: underline;
        }
        
        .item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }
        
        .tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .tag:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }
        
        .movie-card .tag {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid rgba(52, 152, 219, 0.4);
        }
        
        .book-card .tag {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.4);
        }

        .item-select {
            display: flex;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .item-select input {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .item-select label {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            .items-container {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            .tabs-nav {
                flex-direction: column;
                border-radius: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .section-title {
                font-size: 1.8rem;
            }
            
            .items-container {
                grid-template-columns: 1fr;
            }
            
            .search-container {
                padding: 15px;
            }
            
            .tab-btn {
                padding: 12px;
                font-size: 1rem;
            }
      
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .item-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        .item-card:nth-child(1) { animation-delay: 0.1s; }
        .item-card:nth-child(2) { animation-delay: 0.2s; }
        .item-card:nth-child(3) { animation-delay: 0.3s; }
        .item-card:nth-child(4) { animation-delay: 0.4s; }
        .item-card:nth-child(5) { animation-delay: 0.5s; }
        .item-card:nth-child(6) { animation-delay: 0.6s; }
        
        /* 分类指示器 */
        .category-indicator {
            position: absolute;
            top: 0;
            right: 0;
            padding: 8px 15px;
            border-radius: 0 0 0 15px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .movie-card .category-indicator {
            background: var(--movie);
        }
        
        .book-card .category-indicator {
            background: var(--book);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transform: translateX(200%);
            transition: transform 0.5s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification i {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs-nav">
            <button class="tab-btn active" id="movieTabBtn" onclick="switchTab('movieTab')">
                电影
            </button>
            <button class="tab-btn" id="bookTabBtn" onclick="switchTab('bookTab')">
                书籍
            </button>
        </div>
        <!--
        <div class="item-tags">
            <div class="filter-buttons">
                <button class="filter-btn" onclick="filterItems('all')">全部</button>
                <button class="filter-btn" onclick="filterItems('movie')">电影</button>
                <button class="filter-btn" onclick="filterItems('book')">书籍</button>
                <button class="filter-btn" onclick="filterByTag('科幻')">科幻</button>
            </div>
        </div>
    -->
        <div class="action-bar">
            <button class="action-btn" onclick="copySelectedItems()">
                复制选中项目
                <i id="selected-items-count"></i>
            </button>
            <span style="width:50px"></span>
            <button class="action-btn" onclick="clearSelection()">清空</button>
        </div>
        
        
        <div class="tab-content active" id="movieTab">
            <div class="items-container" id="moviesContainer">
            </div>
        </div>
            
        
        <div class="tab-content" id="bookTab">
            <div class="items-container" id="booksContainer">
            </div>
        </div>

        <section class="search-results-section" id="searchResults">
            <div class="search-results-header">
                <h2 class="section-title">标签搜索结果：<span id="currentTag"></span></h2>
            </div>
            <div class="items-container" id="searchResultsContainer">
            </div>
        </section>

       <div class="notification" id="notification">
            <span id="notificationText">已复制选中项目编号到剪贴板</span>
        </div>
    </div>

    <script src="movies.js"></script>
    <script src="books.js"></script>
    <script>      
        
        // 全局变量
        let selectedItems = [];
        let currentTag = "";
        const itemsPerPage = 500;
        let currentMoviesPage = 1;
        let currentBooksPage = 1;
        let currentSearchPage = 1;
        
        // 初始化页面
        function initializePage() {
            renderItems(movies, 'moviesContainer', 'movie');
            renderItems(books, 'booksContainer', 'book');
            
            // 设置按钮事件
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // 处理URL hash
            handleUrlHash();
        }
        // 处理URL hash
        function handleUrlHash() {
            const hash = window.location.hash.substring(1);
            if (hash === "bookTab") {
                switchTab('bookTab');
            } else if (hash === "movieTab") {
                switchTab('movieTab');
            }
        }
        
        // 切换标签页
        function switchTab(tabId) {
            window.location.hash = tabId;
            
            // 更新按钮状态
            document.getElementById('movieTabBtn').classList.remove('active');
            document.getElementById('bookTabBtn').classList.remove('active');
            
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            if (tabId === 'movieTab') {
                document.getElementById('movieTabBtn').classList.add('active');
                document.getElementById('movieTab').classList.add('active');
            } else if (tabId === 'bookTab') {
                document.getElementById('bookTabBtn').classList.add('active');
                document.getElementById('bookTab').classList.add('active');
            }
        }       
        function renderItems(items, containerId, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${type}-card`;
                card.dataset.tags = item.tags.join(' ');
                let content = '';
                if (type === 'movie') {
                    content = `<p class="item-info">${item.year}年 | ${item.country} | ${item.duration} | ⭐${item.rating}</p>
                        <p class="item-description">${item.desc}</p>
                        <button class="toggle-btn" onclick="toggleDescription(this)">展开</button>`;
                } else if (type === 'book') {
                    content = `<p class="item-info">${item.type} | ${item.lan} | ⭐${item.rating} | ${item.pages}页</p>`;
                }
                card.innerHTML = `
                    <div class="item-image">
                        <img id="img-${item.id}" src="" alt="${item.title}" loading="lazy">
                        <span class="item-id">${item.id}</span>
                        <span class="category-indicator">${type === 'movie' ? '电影' : '书籍'}</span>
                    </div>
                    <div class="item-content">
                        <h3 class="item-title">${item.title}</h3>
                        ${content}
                       <!--
                        <div class="item-tags">
                            ${item.tags.map(tag => `<span class="tag" onclick="filterByTag('${tag}')">${tag}</span>`).join('')}
                        </div>
                        -->
                        <div class="item-select">
                            <input type="checkbox" id="${item.id}" name="selectedItems" value="${item.id}" onchange="toggleSelection('${item.id}')">
                            <label for="${item.id}">选择此项目</label>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
                loadImageWithFallback(item.id, item.img_url, item.img);
            });
        }

        function loadImageWithFallback(itemId, primarySrc, fallbackSrc) {
            const imgElement = document.getElementById(`img-${itemId}`);
            
            const timeout = setTimeout(() => {
                if (!imgElement.complete || imgElement.naturalWidth === 0) {
                    imgElement.src = fallbackSrc;
                }
            }, 2500);
            
            imgElement.onload = function() {
                clearTimeout(timeout);
            };
            
            imgElement.onerror = function() {
                clearTimeout(timeout);
                imgElement.src = fallbackSrc;
            };
            
            if (primarySrc) {
                imgElement.src = primarySrc;
            } else {
                imgElement.src = fallbackSrc;
            }
        }
        function filterByTag(tag) {
            currentTag = tag;
            currentSearchPage = 1;
            showSearchResults();
            renderSearchResults();
        }

        function toggleSelection(itemId) {
            const index = selectedItems.indexOf(itemId);
            if (index === -1) {
                selectedItems.push(itemId);
            } else {
                selectedItems.splice(index, 1);
            }
            updateSelectedItemsCount();
        }

        function updateSelectedItemsCount() {
            const selectedItemsCount = document.getElementById('selected-items-count');
            selectedItemsCount.textContent = selectedItems.length;
        }

        function clearSelection() {
            selectedItems = [];
            updateSelectedItemsCount();
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
        }
        
        function copySelectedItems() {
            if (selectedItems.length === 0) {
                showNotification("请先选择至少一个项目");
                return;
            }
            
            const selectedIds = selectedItems.join(', ');
            /*
            navigator.clipboard.writeText(selectedIds)
                .then(() => {
                    showNotification(`已复制选中项目编号: ${selectedIds}`);
                })
                .catch(err => {
                    showNotification("复制失败，请重试");
                    console.error('复制失败:', err);
                });
            */
           const textarea = document.createElement('textarea');
            textarea.value = selectedIds;
            textarea.style.position = 'fixed'; 
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showNotification(`已复制选中项目编号: ${selectedIds}`);
        }
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function showMainSections() {
            document.getElementById('moviesSection').style.display = 'block';
            document.getElementById('booksSection').style.display = 'block';
            document.getElementById('searchResults').style.display = 'none';
        }
        
        function filterByTag(tag) {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                if (btn.textContent === tag) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            searchItems();
        }
        
        function searchItems() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!searchTerm) return;
            
            const filteredMovies = movies.filter(movie => 
                movie.tags.some(tag => tag.toLowerCase().includes(searchTerm)) ||
                movie.title.toLowerCase().includes(searchTerm)
            );
            
            const filteredBooks = books.filter(book => 
                book.tags.some(tag => tag.toLowerCase().includes(searchTerm)) ||
                book.title.toLowerCase().includes(searchTerm)
            );
            
            renderItems(filteredMovies, 'moviesContainer', 'movie');
            renderItems(filteredBooks, 'booksContainer', 'book');
        }
        function toggleDescription(button) {
            const description = button.previousElementSibling;
            description.classList.toggle('expanded');

            if (description.classList.contains('expanded')) {
                button.textContent = '收起';
            } else {
                button.textContent = '展开';
            }
        }
        
        window.onload = initializePage;
        window.addEventListener('hashchange', handleUrlHash);
    </script>
</body>
</html>
