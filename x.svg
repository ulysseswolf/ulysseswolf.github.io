<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chopstick1Color" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="red" />
      <stop offset="15%" stop-color="red" />
      <stop offset="15%" stop-color="black" />
      <stop offset="100%" stop-color="black" />
    </linearGradient>
    
    <linearGradient id="chopstick2Color" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="red" />
      <stop offset="15%" stop-color="red" />
      <stop offset="15%" stop-color="black" />
      <stop offset="100%" stop-color="black" />
    </linearGradient>
  </defs>

  <!-- 第一根筷子：从左上到右下 -->
  <g transform="translate(100,100) rotate(60)">
    <path d="M -80,5 L -80,-5 L 80,-2 L 80,2 Z" 
          fill="url(#chopstick1Color)" 
          stroke="none"/>
  </g>

  <!-- 第二根筷子：从右上到左下 -->
  <g transform="translate(100,100) rotate(120)">
    <path d="M -80,5 L -80,-5 L 80,-2 L 80,2 Z" 
          fill="url(#chopstick2Color)" 
          stroke="none"/>
  </g>
</svg>